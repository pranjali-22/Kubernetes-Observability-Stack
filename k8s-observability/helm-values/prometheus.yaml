# helm-values/prometheus.yaml
# Install: helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
#           -n monitoring --create-namespace -f helm-values/prometheus.yaml

nameOverride: prometheus
fullnameOverride: prometheus

# ── Prometheus configuration ──────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    # Retain 15 days of metrics
    retention: 15d
    retentionSize: "10GB"

    # Storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # Scrape interval
    scrapeInterval: 15s
    evaluationInterval: 15s

    # Allow ServiceMonitors from all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    # Allow PodMonitors from all namespaces
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

# ── Alertmanager ──────────────────────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

  config:
    global:
      resolve_timeout: 5m
      # Configure your SMTP / Slack / PagerDuty here
      slack_api_url: "https://hooks.slack.com/services/REPLACE_ME"

    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "slack-notifications"
      routes:
        - match:
            severity: critical
          receiver: "slack-critical"
          continue: true
        - match:
            severity: warning
          receiver: "slack-notifications"

    receivers:
      - name: "slack-notifications"
        slack_configs:
          - channel: "#alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}
                *Alert:* {{ .Annotations.summary }}
                *Description:* {{ .Annotations.description }}
                *Severity:* {{ .Labels.severity }}
                *Namespace:* {{ .Labels.namespace }}
              {{ end }}

      - name: "slack-critical"
        slack_configs:
          - channel: "#alerts-critical"
            send_resolved: true
            title: '🚨 CRITICAL: {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}
                *Alert:* {{ .Annotations.summary }}
                *Description:* {{ .Annotations.description }}
              {{ end }}

# ── Grafana (embedded in kube-prometheus-stack) ───────────────────────────────
grafana:
  enabled: true
  adminPassword: "admin123"   # Change in production! Use a Secret instead.

  persistence:
    enabled: true
    size: 5Gi

  grafana.ini:
    server:
      domain: grafana.local
    analytics:
      check_for_updates: false
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/default/app-red-metrics.json

  # Auto-provision our custom dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "default"
          orgId: 1
          folder: "App Dashboards"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  # Mount dashboard ConfigMap
  dashboardsConfigMaps:
    default: "grafana-dashboards"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── Node Exporter ─────────────────────────────────────────────────────────────
nodeExporter:
  enabled: true

# ── kube-state-metrics ────────────────────────────────────────────────────────
kubeStateMetrics:
  enabled: true

# ── Default PrometheusRule: Application Alerts ────────────────────────────────
additionalPrometheusRulesMap:
  app-rules:
    groups:
      # ── RED Method Alerts ──────────────────────────────────────────────────
      - name: app.red_method
        interval: 30s
        rules:

          # ── Rate ────────────────────────────────────────────────────────────
          - alert: LowRequestRate
            expr: |
              sum(rate(http_requests_total{namespace="observability-demo"}[5m])) < 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Low request rate detected"
              description: "Request rate is {{ $value | humanize }} req/s, below expected threshold."

          # ── Errors ──────────────────────────────────────────────────────────
          - alert: HighErrorRate
            expr: |
              (
                sum(rate(http_request_errors_total{namespace="observability-demo"}[5m]))
                /
                sum(rate(http_requests_total{namespace="observability-demo"}[5m]))
              ) * 100 > 5
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High HTTP error rate"
              description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes (threshold: 5%)."

          - alert: High5xxErrorRate
            expr: |
              (
                sum(rate(http_requests_total{namespace="observability-demo",status_code=~"5.."}[5m]))
                /
                sum(rate(http_requests_total{namespace="observability-demo"}[5m]))
              ) * 100 > 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Elevated 5xx error rate"
              description: "5xx rate is {{ $value | humanizePercentage }}."

          # ── Duration / Latency ──────────────────────────────────────────────
          - alert: HighP99Latency
            expr: |
              histogram_quantile(0.99,
                sum(rate(http_request_duration_seconds_bucket{namespace="observability-demo"}[5m])) by (le, route)
              ) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High p99 latency on {{ $labels.route }}"
              description: "p99 latency is {{ $value | humanizeDuration }} (threshold: 2s)."

          - alert: HighP95Latency
            expr: |
              histogram_quantile(0.95,
                sum(rate(http_request_duration_seconds_bucket{namespace="observability-demo"}[5m])) by (le)
              ) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High p95 latency"
              description: "p95 latency is {{ $value | humanizeDuration }} (threshold: 1s)."

      # ── Infrastructure Alerts ──────────────────────────────────────────────
      - name: app.infrastructure
        rules:

          - alert: PodNotReady
            expr: |
              kube_pod_status_ready{namespace="observability-demo",condition="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is not ready"
              description: "Pod has been in a non-ready state for more than 5 minutes."

          - alert: PodCrashLooping
            expr: |
              increase(kube_pod_container_status_restarts_total{namespace="observability-demo"}[15m]) > 3
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"
              description: "Container {{ $labels.container }} has restarted {{ $value }} times in the last 15 minutes."

          - alert: HighMemoryUsage
            expr: |
              (
                container_memory_working_set_bytes{namespace="observability-demo",container!=""}
                /
                kube_pod_container_resource_limits{namespace="observability-demo",resource="memory"}
              ) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage in {{ $labels.container }}"
              description: "Container is using {{ $value | humanizePercentage }} of its memory limit."

          - alert: HighCPUUsage
            expr: |
              (
                rate(container_cpu_usage_seconds_total{namespace="observability-demo",container!=""}[5m])
                /
                kube_pod_container_resource_limits{namespace="observability-demo",resource="cpu"}
              ) * 100 > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage in {{ $labels.container }}"
              description: "Container is using {{ $value | humanizePercentage }} of its CPU limit."

      # ── Database Alerts ────────────────────────────────────────────────────
      - name: app.database
        rules:

          - alert: SlowDBQueries
            expr: |
              histogram_quantile(0.95,
                sum(rate(db_query_duration_seconds_bucket{namespace="observability-demo"}[5m])) by (le, operation, table)
              ) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Slow DB queries on {{ $labels.table }}"
              description: "p95 query duration for {{ $labels.operation }} on {{ $labels.table }} is {{ $value | humanizeDuration }}."
